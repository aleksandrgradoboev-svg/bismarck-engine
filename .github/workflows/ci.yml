name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Keep LF line endings (gofmt rejects CRLF)
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        shell: bash
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "$out"; exit 1; fi
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -count=1 ./...
      # Durable code mode starts calls, delivers results and commits on
      # goroutines; with one processor each goroutine runs to its end before
      # the next, an order several processors rarely give. PR #70's ordering
      # and batching defects showed only there.
      - name: test with one processor (durable code mode)
        run: go test -count=1 -cpu 1 ./durable/codemode/...
      # The durable harness schedules, wakes and joins invocations on
      # goroutines the same way. Its two 20,000-task chain tests measure depth,
      # not ordering, and with one processor outrun their 10 s wait; the test
      # step runs them.
      - name: test with one processor (durable harness)
        run: go test -count=1 -cpu 1 -skip 'TestRetentionForgetsA20000DeepChainOfEndedTasksWithoutRecursion|TestOwnershipTracksOwnershipChainsDeeperThanTheCallStack' ./durable/harness/...
      # codemode runs each VM, tool call and timer on its own goroutine, and the
      # MCP client and server manager connect in the background, and tools
      # change the session's tool loadout while the loop reads it; the
      # in-memory telemetry adapter records spans and measurements from
      # concurrent goroutines; the race detector needs cgo, which the Linux
      # runner has.
      - name: race (codemode, mcp, subagents, nested tool calls, tool registry, telemetry)
        if: runner.os == 'Linux'
        run: |
          # The 20,000-task ownership chain tests depth, not concurrency; the
          # race detector stretches it to minutes and past its 10 s wait. The
          # test step runs it.
          go test -race -count=1 -skip 'TestOwnershipTracksOwnershipChainsDeeperThanTheCallStack' ./codemode/... ./mcp/... ./coding/mcpext/... ./coding/toolsearch/... ./coding/subagentext/... ./chord/ ./chord/output/... ./durable/... ./telemetry/...
          # The codemode tool's time and heap-limit tests measure speed, which
          # the race detector's slowdown breaks; the test step runs them.
          go test -race -count=1 -skip 'TestOutputAtItemLimitIsLinear|TestMemoryLimit' ./coding/codemodetool/...
          go test -race -count=1 -run 'Nested|Registry|SetPromptSection|ModelOnly|Orchestration|PrepareLoadout|RestoreTools|PendingTools|ToolModifiers|ExcludeTools|AllowlistKeepsMCP|RestoreSkipsUnnamed' ./agent/ ./coding/
          # A Models request's span stays open on its own goroutine while
          # another forwards and observes the stream.
          go test -race -count=1 -run 'Telemetry|ForwardObserved' ./ai/
      # The SQLite file adapter is a module of its own, so the root module needs
      # no driver; ./... above does not reach it.
      - name: vet and test (SQLite file adapter module)
        working-directory: durable/storage/sqlite/modernc
        shell: bash
        run: |
          go vet ./...
          go test -count=1 ./...
      - name: race (SQLite file adapter module)
        if: runner.os == 'Linux'
        working-directory: durable/storage/sqlite/modernc
        run: go test -race -count=1 ./...
