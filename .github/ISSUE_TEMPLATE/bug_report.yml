name: Bug report
description: Something behaves wrongly, or a test fails
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: >-
        The failing output in full. For a flaky test the failure message matters most: run it with
        -count=50 (and -cpu 1 or -race if that is where it failed) and paste the first failure.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Engine version
      description: The tag or commit, e.g. v0.3.0 or the output of `git rev-parse --short HEAD`.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS and Go version
      placeholder: "Windows 11, go1.26.1"
    validations:
      required: true
